openapi: 3.0.3
info:
  title: Think Backend — API de Cedente
  description: |
    API de **cadastro de cedente** para integração do front-end (CRUD). Inclui endereço, partes relacionadas, avalistas, contas de desembolso e documentos.

    **Documentação interativa:** `{baseUrl}/docs/cedente`

    ---

    ## Autenticação

    1. `POST /login` com `email` e `password`.
    2. Guarde `token` e `user.id`.
    3. Nas rotas protegidas, envie **`User`** = id do usuário e **`Authorization`** = token **sem** o prefixo `Bearer `.

    ---

    ## `fund_id` (obrigatório em todas as rotas)

    Todo cedente pertence a um fundo. Envie `fund_id` no JSON (`POST`, `PUT`, `PATCH`) ou na query (`GET`, `DELETE`). Inteiro ≥ 1; fundo deve existir. Listagens e consultas são filtradas por fundo.

    ---

    ## Status do cadastro (o que o front precisa saber)

    | Status | Significado para o cliente |
    |--------|---------------------------|
    | **`rascunho`** | Cadastro **incompleto**. Pode salvar parcialmente; **não** há validação contra bases oficiais. Corrija os campos faltantes e salve de novo. |
    | **`pendente`** | Cadastro **completo** e em análise interna. Todos os blocos obrigatórios foram preenchidos. |
    | **`inconsistente`** | Cadastro completo, mas há **divergências** entre o que foi informado e os dados oficiais (CNPJ/QSA). Veja o array **`inconsistencias`** na resposta e ajuste os campos indicados em `campo_inconsistente`. |

    Outros valores de `status` (`em_avaliacao`, `aprovado`, `vencido`, `cancelado`) podem aparecer em listagens e resumos; são etapas **posteriores** ao envio do cadastro e não exigem ação do formulário de cadastro.

    ---

    ## Por que o cadastro ficou em `rascunho`?

    O backend **não exige** todos os campos na primeira gravação. Ao salvar (`POST /cedente/save`, `PUT /cedente/edit` ou `PATCH /cedente/patch`), se **qualquer** item abaixo estiver faltando, o status permanece ou volta para **`rascunho`**:

    | Bloco | O que precisa estar preenchido |
    |-------|-------------------------------|
    | Cedente | `fund_id`, `nome`, `documento` |
    | Endereço | `cep`, `logradouro`, `numero`, `bairro`, `estado`, `cidade` |
    | Partes relacionadas | Ao menos **1** item em `partes_relacionadas` com `nome` |
    | Contas de desembolso | Ao menos **1** conta com `tipo_conta`, `codigo_banco`, `agencia`, `numero_conta` |
    | Documentos | **13** arquivos distintos (`document_type` de **1** a **13**), cada um com `original_name` e `content_base64` (ou `base64`) |

    Quando **todos** os itens acima estiverem ok, o status passa automaticamente para **`pendente`**. Se houver divergência com dados oficiais, pode ir para **`inconsistente`** — consulte `inconsistencias` na resposta.

    **Dica:** não tente forçar `status: pendente` no JSON enquanto o cadastro estiver incompleto; o backend mantém `rascunho` ou retorna erro 400.

    ---

    ## Campo `inconsistencias` (sempre presente na resposta)

    Toda vez que um cedente é retornado — `GET /cedentes/get/{id}`, `POST /cedentes/all`, e o `data` de `POST /cedente/save`, `PUT /cedente/edit` e `PATCH /cedente/patch` — o objeto inclui:

    ```json
    "inconsistencias": [
      { "id": 1, "campo_inconsistente": "nome", "valor_serpro": "RAZAO SOCIAL LTDA" }
    ]
    ```

    - Array **vazio** `[]` quando não há divergências pendentes.
    - Quando `status` é **`inconsistente`**, o array traz **todas** as linhas pendentes; use `campo_inconsistente` para destacar o campo no formulário e `valor_serpro` como referência do valor oficial.

    ---

    ## Operações de cadastro

    - **`POST /cedente/save`** — criar (completo ou parcial). Só `fund_id` é obrigatório na requisição.
    - **`PUT /cedente/edit`** — substituição em snapshot; listas enviadas **substituem** as anteriores (omitir lista = esvaziar).
    - **`PATCH /cedente/patch`** — alteração parcial; só as chaves enviadas mudam.
    - **`GET /cedentes/get/{id}`** — detalhe com `partes_relacionadas` e `avalistas` separados.
    - **`POST /cedentes/all`** — listagem paginada do fundo + `cadastro_status_resumo`.
    - **`POST /cedentes/status-resumo`** — contagem por status (inclui `rascunho`).
    - **`GET /cedentes/historico/{id}`** — histórico de eventos do cadastro.
    - **`DELETE /cedente/remove/{id}`** — exclusão.

    Itens com o **mesmo CPF** em `partes_relacionadas` e `avalistas` são unificados em um único registro com ambas as flags.
  version: 1.0.0
  contact:
    name: Think Backend

servers:
  - url: "{baseUrl}"
    description: URL base da API (sem barra final)
    variables:
      baseUrl:
        default: https://api.exemplo.com
        description: Ex. origem do front ou Postman

tags:
  - name: Autenticação
    description: Login e validação de sessão (rotas web do Laravel)
  - name: Cedente
    description: CRUD de cedente e recursos aninhados

security:
  - userIdHeader: []
    authTokenHeader: []

paths:
  /login:
    post:
      tags: [Autenticação]
      operationId: login
      summary: Login (email e senha)
      description: |
        Implementado em `UserController@login` (`routes/web.php`). Mesma origem/base URL que `/cedente/*` (ex.: porta 8000 do Apache/PHP ou proxy reverso).

        Corpo: JSON com `email` e `password`, ou `application/x-www-form-urlencoded` com os mesmos campos.

        Credenciais inválidas retornam HTTP 200 com `user` e `token` nulos (não há código 401 explícito no controller).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              json:
                summary: JSON
                value:
                  email: usuario@exemplo.com
                  password: "sua_senha"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sucesso (token preenchido) ou falha (user e token nulos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                sucesso:
                  summary: Login ok
                  value:
                    token: "YmFzZTY0X3Rva2VuX2V4ZW1wbG8="
                    user:
                      id: 1
                      email: usuario@exemplo.com
                falha:
                  summary: Credenciais inválidas
                  value:
                    token: null
                    user: null

  /check-token:
    get:
      tags: [Autenticação]
      operationId: checkToken
      summary: Verificar se token ainda é válido
      description: |
        Headers obrigatórios: `User` (id) e `Authorization` (token cru, igual ao login).
        Resposta: `{ "status": true | false }`.
      responses:
        "200":
          description: Resultado da comparação do token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckTokenResponse"
        "403":
          description: Headers ausentes ou token inválido (mensagem em JSON ou texto)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
            text/plain:
              schema:
                type: string

  /logout:
    post:
      tags: [Autenticação]
      operationId: logout
      summary: Encerrar sessão (invalida o token no servidor)
      description: |
        Requer headers `User` e `Authorization` (mesmo formato das demais rotas autenticadas).
      responses:
        "200":
          description: Processado (corpo pode ser vazio)
        "403":
          description: Não autenticado

  /cedente/save:
    post:
      tags: [Cedente]
      operationId: createCedente
      summary: Criar cedente (completo ou rascunho)
      description: |
        **`fund_id` obrigatório** no JSON (inteiro ≥ 1, fundo existente em `fund`).
        Demais campos são opcionais: cadastro incompleto recebe status **`rascunho`**.
        Quando todos os blocos obrigatórios estiverem preenchidos (ver descrição geral), o status passa para **`pendente`** automaticamente.
        A resposta inclui **`inconsistencias`** (preenchido se o status for `inconsistente`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CedenteCreateRequest"
            examples:
              rascunho:
                $ref: "#/components/examples/CedenteCreateBody"
              completo:
                $ref: "#/components/examples/CedenteCreateBodyCompleto"
      responses:
        "200":
          description: |
            Cadastro realizado. O `data` retornado inclui `status` (`rascunho`, `pendente` ou `inconsistente`) e `inconsistencias`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteSaveOrEditSuccessResponse"
        "400":
          description: Validação ou erro de persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedente/edit:
    put:
      tags: [Cedente]
      operationId: updateCedente
      summary: Atualizar cedente (snapshot completo)
      description: |
        Substitui dados do cadastro conforme o body. **`fund_id`** obrigatório.
        `nome` e `documento` obrigatórios apenas quando o cadastro estiver completo (fora de rascunho).
        Após salvar, se o cadastro passar a estar completo saindo de rascunho, promove para `pendente` + SERPRO.
        `partes_relacionadas`, `avalistas` e `contas_desembolso` **sempre** recriadas a partir do JSON (listas omitidas = vazias).
        Para alterar só um campo (ex.: status), use **`PATCH /cedente/patch`**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CedenteUpdateRequest"
      responses:
        "200":
          description: Atualização realizada; `data` inclui `status` e `inconsistencias`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteSaveOrEditSuccessResponse"
        "400":
          description: Validação ou erro de persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedente/patch:
    patch:
      tags: [Cedente]
      operationId: patchCedente
      summary: Atualização parcial (um ou mais campos)
      description: |
        Envie **`id`** e **`fund_id`** (obrigatórios) e apenas os demais campos a alterar (ex.: `status`, `telefone`).
        O que não vier no JSON **não é alterado**. Listas e arquivos só mudam se a chave existir no body.
        Completar todos os blocos obrigatórios em um cedente `rascunho` promove automaticamente para `pendente` + SERPRO.
        Não use esta rota para substituir o cadastro inteiro — use `PUT /cedente/edit`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CedentePatchRequest"
      responses:
        "200":
          description: Atualização realizada; `data` inclui `status` e `inconsistencias`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteSaveOrEditSuccessResponse"
        "400":
          description: Validação ou erro de persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedentes/get/{id}:
    get:
      tags: [Cedente]
      operationId: getCedenteById
      summary: Obter cedente por id
      description: |
        Retorna o cadastro completo no formato do front (`partes_relacionadas` e `avalistas` separados).
        Inclui sempre o array **`inconsistencias`** (vazio ou com divergências pendentes).
        Query **`fund_id` obrigatória**.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fund_id
          in: query
          required: true
          description: ID do fundo (obrigatório). Inteiro ≥ 1; fundo deve existir.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteGetSuccessResponse"
        "404":
          description: Cedente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedentes/historico/{id}:
    get:
      tags: [Cedente]
      operationId: listCedenteHistoricoStatus
      summary: Histórico de alterações de status do cadastro
      description: |
        Gravações em `cedente_audit`: ao criar (`cadastro_criado`, `old_status` nulo) e a cada mudança de status no `PUT /cedente/edit` ou `PATCH /cedente/patch` (`status_alterado`).
        O usuário é o da requisição autenticada (header `User`); campos `user_id` e `usuario_email` na resposta.
        A data/hora do evento é `created_at`.
        Query **`fund_id` obrigatória** (mesmo escopo das demais rotas de cedente).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fund_id
          in: query
          required: true
          description: ID do fundo (obrigatório). Inteiro ≥ 1; fundo deve existir.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lista ordenada do mais recente ao mais antigo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteHistoricoStatusResponse"
        "404":
          description: Cedente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedentes/all:
    post:
      tags: [Cedente]
      operationId: listCedentes
      summary: Listar cedentes (paginação Laravel)
      description: |
        **`fund_id` obrigatório** no corpo JSON. Lista apenas cedentes desse fundo.
        Cada item em `data` inclui o array **`inconsistencias`** (vazio ou com divergências).
        A raiz da resposta inclui `fund_id` e **`cadastro_status_resumo`** (contagens por status, incluindo `rascunho`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fund_id]
              properties:
                fund_id:
                  type: integer
                  minimum: 1
                  description: ID do fundo (obrigatório).
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                  description: Itens por página
      responses:
        "200":
          description: Página de resultados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedentePaginatedListResponse"

  /cedentes/status-resumo:
    post:
      tags: [Cedente]
      operationId: cedentesCadastroStatusResumo
      summary: Resumo de cadastros por status
      description: |
        **`fund_id` obrigatório** no corpo JSON. Retorna contagens por status e total de cedentes **do fundo informado**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fund_id]
              properties:
                fund_id:
                  type: integer
                  minimum: 1
                  description: ID do fundo (obrigatório).
      responses:
        "200":
          description: Contagens atuais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteStatusResumoResponse"

  /cedente/remove/{id}:
    delete:
      tags: [Cedente]
      operationId: deleteCedente
      summary: Excluir cedente e dependências
      description: |
        Query **`fund_id` obrigatória** — exclusão limitada ao escopo do fundo informado.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fund_id
          in: query
          required: true
          description: ID do fundo (obrigatório). Inteiro ≥ 1; fundo deve existir.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Excluído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessMessageOnly"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Erro ao excluir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: User
      description: |
        ID numérico do usuário (`user.id` retornado por `POST /login`).
        O middleware `auth.api` também aceita `user_id` no corpo em alguns casos; o padrão para APIs é este header.
    authTokenHeader:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Token retornado no campo `token` de `POST /login`, **sem** prefixo `Bearer `.
        O valor enviado aqui deve ser **idêntico** ao string `token` da resposta.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      description: Resposta do `UserController@login`.
      properties:
        token:
          type: string
          nullable: true
          description: Token de API; null se login falhou.
        user:
          nullable: true
          description: |
            Modelo `User` serializado (senha oculta), com relações carregadas pelo login (`functionalities`, `employee`, `displays`, etc.), ou null se falhou.
          type: object
          additionalProperties: true

    CheckTokenResponse:
      type: object
      required: [status]
      properties:
        status:
          type: boolean
          description: true se o token confere com o armazenado para o usuário informado.

    ApiErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: ["true"]
          description: Convenção legada do projeto (string).
        message:
          type: string

    ApiSuccessMessageOnly:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: ["false"]
        message:
          type: string

    Address:
      type: object
      description: Endereço (tabela `address`). No create/update, todos os campos são opcionais; objeto vazio remove endereço do cedente no PUT.
      properties:
        id:
          type: integer
          readOnly: true
        cep:
          type: string
          nullable: true
        logradouro:
          type: string
          nullable: true
        numero:
          type: string
          nullable: true
        complemento:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        estado:
          type: string
          nullable: true
          description: UF (2 caracteres)
          maxLength: 2
        cidade:
          type: string
          nullable: true
        pais:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    TipoParteRelacionada:
      type: integer
      nullable: true
      minimum: 1
      maximum: 4
      description: |
        Obrigatório para parte relacionada no sentido de negócio; null se for só avalista.
        1 = sócio, 2 = administrador, 3 = procurador, 4 = representante legal.

    TipoConta:
      type: string
      description: Valores exatos aceitos pelo banco (ENUM MySQL).
      enum:
        - conta_corrente
        - conta_poupanca
        - conta_salario

    PessoaVinculadaInput:
      type: object
      required: [nome]
      description: Item de `partes_relacionadas` ou `avalistas` no body de create/update.
      properties:
        nome:
          type: string
        tipo_parte_relacionada:
          $ref: "#/components/schemas/TipoParteRelacionada"
        nacionalidade:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        beneficiario_final:
          type: boolean
          default: false
        assinante_operacao:
          type: boolean
          default: false
        assinante_obrigatorio:
          type: boolean
          default: false
        estado_civil:
          type: string
          nullable: true
        regime_casamento:
          type: string
          nullable: true
        profissao:
          type: string
          nullable: true
        endereco:
          $ref: "#/components/schemas/Address"

    ContaDesembolsoInput:
      type: object
      required: [tipo_conta, codigo_banco, agencia, numero_conta]
      description: Conta de desembolso no body (sem id; `cedente_id` é definido pelo servidor).
      properties:
        tipo_conta:
          $ref: "#/components/schemas/TipoConta"
        codigo_banco:
          type: string
          maxLength: 8
        agencia:
          type: string
          maxLength: 16
        numero_conta:
          type: string
          maxLength: 32
        digito_conta:
          type: string
          nullable: true
          maxLength: 4
        descricao:
          type: string
          nullable: true

    DocumentTypeCedente:
      type: integer
      minimum: 1
      maximum: 13
      description: |
        1 Contrato/Estatuto Social · 2 Certidão Simplificada Junta Comercial · 3 Ata Eleição Diretoria ·
        4 Cartão CNPJ · 5 Parecer Compliance/Reputacional · 6 Demonstração Financeira ·
        7 Ata/Parecer Crédito · 8 Consulta Órgãos Proteção Crédito · 9 Relatório Visita ·
        10 Parecer/Ficha Gestor · 11 Comprovante Residência · 12 Declaração Faturamento ·
        13 Declaração Relacionamento Bancário.

    CedenteArquivoInput:
      type: object
      required: [document_type, original_name]
      description: |
        Um dos 13 documentos. Informe `content_base64` ou `base64` com o arquivo.
        Base64 puro ou data URL (`data:application/pdf;base64,...`). Limite ~20MB por arquivo após decodificar.
      properties:
        document_type:
          $ref: "#/components/schemas/DocumentTypeCedente"
        original_name:
          type: string
          description: Nome exibido/enviado pelo cliente (ex. contrato.pdf).
        content_base64:
          type: string
        base64:
          type: string
          description: Alias opcional de content_base64.
        type:
          type: string
          description: Opcional; extensão sugerida (ex. pdf), alinhado ao uso de `type` em project_file.

    CedenteArquivoResource:
      type: object
      description: Metadado do arquivo salvo (sem o binário).
      properties:
        id:
          type: integer
        document_type:
          $ref: "#/components/schemas/DocumentTypeCedente"
        document_type_label:
          type: string
          nullable: true
        original_name:
          type: string
        name:
          type: string
          description: Nome do arquivo no servidor (pasta cedente-files).
        type:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CedenteCreateRequest:
      type: object
      required: [fund_id]
      description: |
        **`fund_id` obrigatório** em todo cadastro/edição (inteiro ≥ 1, fundo existente).
        Cadastro incompleto → status `rascunho` (sem SERPRO). `arquivos` opcional em rascunho; necessários 13 tipos (1–13) para promoção a `pendente`.
        No **PUT /cedente/edit**, `arquivos` é opcional; se enviado, substitui os anteriores.
      properties:
        fund_id:
          type: integer
          minimum: 1
          description: ID do fundo ao qual o cedente pertence (obrigatório).
        nome:
          type: string
          nullable: true
          description: Opcional em rascunho; obrigatório para cadastro completo.
        documento:
          type: string
          nullable: true
          description: Opcional em rascunho; obrigatório para cadastro completo.
        email:
          type: string
          nullable: true
        faturamento_anual:
          type: number
          format: double
          nullable: true
        minimo_assinantes:
          type: integer
          minimum: 0
          nullable: true
        sistema_financeiro_nacional:
          type: boolean
          default: false
        telefone:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CedenteCadastroStatus"
          description: Opcional no POST; inferido automaticamente (`rascunho` ou `pendente`). Não é possível forçar status final enquanto incompleto.
        endereco:
          $ref: "#/components/schemas/Address"
        partes_relacionadas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaInput"
          default: []
        avalistas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaInput"
          default: []
        contas_desembolso:
          type: array
          items:
            $ref: "#/components/schemas/ContaDesembolsoInput"
          default: []
        arquivos:
          type: array
          items:
            $ref: "#/components/schemas/CedenteArquivoInput"
          description: |
            Opcional em rascunho. Para cadastro completo, envie os treze documentos (tipos 1–13, sem repetir).

    CedenteUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/CedenteCreateRequest"
        - type: object
          required: [id, fund_id]
          properties:
            id:
              type: integer
              minimum: 1

    CedentePatchRequest:
      type: object
      required: [id, fund_id]
      description: |
        Atualização parcial (`PATCH /cedente/patch`). `id` e `fund_id` obrigatórios (escopo do fundo).
      properties:
        id:
          type: integer
          minimum: 1
        fund_id:
          type: integer
          minimum: 1
        nome:
          type: string
        documento:
          type: string
        email:
          type: string
          nullable: true
        faturamento_anual:
          type: number
          format: double
          nullable: true
        minimo_assinantes:
          type: integer
          minimum: 0
          nullable: true
        sistema_financeiro_nacional:
          type: boolean
        telefone:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CedenteCadastroStatus"
        endereco:
          $ref: "#/components/schemas/Address"
        partes_relacionadas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaInput"
        avalistas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaInput"
        contas_desembolso:
          type: array
          items:
            $ref: "#/components/schemas/ContaDesembolsoInput"
        arquivos:
          type: array
          items:
            $ref: "#/components/schemas/CedenteArquivoInput"
          description: Opcional em rascunho; substitui arquivos se enviado.

    PessoaVinculadaDetail:
      type: object
      description: Pessoa persistida; no GET/save/edit aparece dentro de `partes_relacionadas` e/ou `avalistas` conforme flags.
      properties:
        id:
          type: integer
        cedente_id:
          type: integer
        e_parte_relacionada:
          type: boolean
        e_avalista:
          type: boolean
        nome:
          type: string
        tipo_parte_relacionada:
          $ref: "#/components/schemas/TipoParteRelacionada"
        nacionalidade:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        beneficiario_final:
          type: boolean
        assinante_operacao:
          type: boolean
        assinante_obrigatorio:
          type: boolean
        estado_civil:
          type: string
          nullable: true
        regime_casamento:
          type: string
          nullable: true
        profissao:
          type: string
          nullable: true
        address_id:
          type: integer
          nullable: true
        endereco:
          $ref: "#/components/schemas/Address"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CedenteCadastroStatus:
      type: string
      description: |
        Status do cadastro. Para o formulário de cadastro, os relevantes são:
        - **`rascunho`** — incompleto; preencha os blocos obrigatórios (ver descrição geral da API).
        - **`pendente`** — completo; aguardando análise.
        - **`inconsistente`** — divergência com dados oficiais; corrija campos listados em `inconsistencias`.
        Demais valores são etapas internas posteriores ao envio.
      enum:
        - rascunho
        - pendente
        - em_avaliacao
        - inconsistente
        - aprovado
        - vencido
        - cancelado

    CedenteStatusResumoData:
      type: object
      required:
        - rascunho
        - pendente
        - em_avaliacao
        - inconsistente
        - aprovado
        - vencido
        - cancelado
        - total
      properties:
        rascunho:
          type: integer
          minimum: 0
        pendente:
          type: integer
          minimum: 0
        em_avaliacao:
          type: integer
          minimum: 0
        inconsistente:
          type: integer
          minimum: 0
        aprovado:
          type: integer
          minimum: 0
        vencido:
          type: integer
          minimum: 0
        cancelado:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Total de registros na tabela `cedente` (independente do valor de `status`).

    CedenteStatusResumoResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: string
          enum: ["false"]
        data:
          $ref: "#/components/schemas/CedenteStatusResumoData"

    CedenteHistoricoStatusItem:
      type: object
      properties:
        id:
          type: integer
        event:
          type: string
          description: |
            `cadastro_criado` — primeiro status ao salvar; `status_alterado` — mudança via `PUT /cedente/edit`.
          enum:
            - cadastro_criado
            - status_alterado
        old_status:
          type: string
          nullable: true
          description: Status anterior; nulo na criação do cadastro.
        new_status:
          type: string
          description: Status após o evento.
        user_id:
          type: integer
          nullable: true
          description: ID do usuário autenticado na requisição (header `User`).
        usuario_email:
          type: string
          nullable: true
          format: email
        created_at:
          type: string
          format: date-time
          description: Data/hora do registro (quando ocorreu o evento).

    CedenteHistoricoStatusResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: string
          enum: ["false"]
        data:
          type: array
          items:
            $ref: "#/components/schemas/CedenteHistoricoStatusItem"

    CedenteInconsistenciaItem:
      type: object
      description: Divergência entre o valor cadastrado e o retornado pela base oficial (CNPJ/QSA).
      properties:
        id:
          type: integer
        campo_inconsistente:
          type: string
          description: |
            Identificador do campo no cadastro (ex.: `nome`, `documento`, `endereco.cep`, `partes_relacionadas[0].nome`).
            Use para destacar o input correspondente no formulário.
        valor_serpro:
          type: string
          nullable: true
          description: Valor de referência retornado pela base oficial para comparação/correção.

    ContaDesembolsoResource:
      type: object
      properties:
        id:
          type: integer
        cedente_id:
          type: integer
        tipo_conta:
          $ref: "#/components/schemas/TipoConta"
        codigo_banco:
          type: string
        agencia:
          type: string
        numero_conta:
          type: string
        digito_conta:
          type: string
          nullable: true
        descricao:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CedenteDetail:
      type: object
      description: |
        Formato retornado em `data` no GET, save, edit e patch.
        Sempre inclui **`inconsistencias`** (array vazio ou com itens quando `status` é `inconsistente`).
      properties:
        id:
          type: integer
        fund_id:
          type: integer
        nome:
          type: string
          nullable: true
        documento:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        faturamento_anual:
          type: string
          nullable: true
          description: Decimal pode vir como string no JSON do Laravel.
        minimo_assinantes:
          type: integer
          nullable: true
        sistema_financeiro_nacional:
          type: boolean
        telefone:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CedenteCadastroStatus"
        sla:
          type: string
          format: date
          nullable: true
          description: Data limite informativa do cadastro (`Y-m-d`). Nulo em `rascunho`.
        endereco:
          $ref: "#/components/schemas/Address"
          nullable: true
        partes_relacionadas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaDetail"
        avalistas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaDetail"
        contas_desembolso:
          type: array
          items:
            $ref: "#/components/schemas/ContaDesembolsoResource"
        arquivos:
          type: array
          items:
            $ref: "#/components/schemas/CedenteArquivoResource"
        inconsistencias:
          type: array
          description: |
            Sempre presente. Vazio quando não há divergências.
            Quando `status` é `inconsistente`, contém todas as divergências pendentes do cedente.
          items:
            $ref: "#/components/schemas/CedenteInconsistenciaItem"

    CedenteGetSuccessResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: string
          enum: ["false"]
        data:
          $ref: "#/components/schemas/CedenteDetail"

    CedenteSaveOrEditSuccessResponse:
      type: object
      required: [error, message, data]
      properties:
        error:
          type: string
          enum: ["false"]
        message:
          type: string
        data:
          $ref: "#/components/schemas/CedenteDetail"

    CedenteListItem:
      type: object
      description: |
        Item retornado em `data` na listagem paginada (`POST /cedentes/all`).
        Estrutura Eloquent (snake_case); `pessoas_vinculadas` agrupa partes e avalistas.
        Inclui sempre **`inconsistencias`** (mesmo formato do GET unitário).
      properties:
        id:
          type: integer
        fund_id:
          type: integer
        nome:
          type: string
          nullable: true
        documento:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        faturamento_anual:
          type: string
          nullable: true
        minimo_assinantes:
          type: integer
          nullable: true
        address_id:
          type: integer
          nullable: true
        sistema_financeiro_nacional:
          type: boolean
        telefone:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CedenteCadastroStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        address:
          $ref: "#/components/schemas/Address"
          nullable: true
        pessoas_vinculadas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaRowList"
        contas_desembolso:
          type: array
          items:
            $ref: "#/components/schemas/ContaDesembolsoResource"
        inconsistencias:
          type: array
          description: Divergências pendentes (vazio se não houver).
          items:
            $ref: "#/components/schemas/CedenteInconsistenciaItem"

    PessoaVinculadaRowList:
      type: object
      description: Linha de `cedente_pessoa_vinculada` na listagem (relação `pessoas_vinculadas` sem eager load de `address`).
      properties:
        id:
          type: integer
        cedente_id:
          type: integer
        e_parte_relacionada:
          type: boolean
        e_avalista:
          type: boolean
        nome:
          type: string
        tipo_parte_relacionada:
          $ref: "#/components/schemas/TipoParteRelacionada"
        nacionalidade:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        beneficiario_final:
          type: boolean
        assinante_operacao:
          type: boolean
        assinante_obrigatorio:
          type: boolean
        estado_civil:
          type: string
          nullable: true
        regime_casamento:
          type: string
          nullable: true
        profissao:
          type: string
          nullable: true
        address_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CedentePaginatedListResponse:
      type: object
      description: |
        Resposta de `paginate()` do Laravel com campo extra `cadastro_status_resumo` (via `additional()` no controller).
        No cliente: `body.cadastro_status_resumo.pendente`, `body.cadastro_status_resumo.total`, etc.
      properties:
        cadastro_status_resumo:
          $ref: "#/components/schemas/CedenteStatusResumoData"
          description: |
            Contagens globais de cadastros por status (não restritas à página atual). Implementação: `Cedente::cadastroStatusResumo()`.
        current_page:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/CedenteListItem"
        first_page_url:
          type: string
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

