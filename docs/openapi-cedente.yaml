openapi: 3.0.3
info:
  title: Cadastro cedente - API de Cedentes
  description: |
    API de **cadastro de cedente** (CRUD): endereço, partes relacionadas, avalistas, contas de desembolso e documentos.

    ### Como usar este Swagger

    1. A URL base já está em **Servers** (`http://54.85.29.32:8000`).
    2. Execute **POST /login** com `email` e `password`; guarde `token` e `user.id`.
    3. Clique em **Authorize** (cadeado): **`User`** = id do usuário, **`Authorization`** = token **sem** prefixo `Bearer `.
    4. Em rotas de cedente, envie sempre **`fund_id`** no JSON (`POST`/`PUT`/`PATCH`) ou na query (`GET`/`DELETE`/download).

    O guia completo de integração (status, papéis, payloads, arquivos, avaliação, etc.) está na seção **Guia de integração** no final desta página, após Schemas.
  version: 1.1.0
  contact:
    name: Think Backend

servers:
  - url: http://54.85.29.32:8000
    description: API Think Backend (ambiente padrão)

x-frontend-guide:
  title: Guia de integração
  description: Referência detalhada de regras de negócio, objetos e fluxos para integração do front-end.
  sections:
    - id: status
      title: Status do cadastro
      content: |
        | Status | Significado para o front |
        |--------|--------------------------|
        | **`rascunho`** | Cadastro **incompleto**. Pode salvar parcialmente. Editável por **preenchimento** e **admin**. |
        | **`pendente`** | Cadastro **completo**; aguardando análise do **avalista**/admin (arquivos e avaliação). |
        | **`inconsistente`** | Há pendências (arquivo recusado ou correções pedidas pelo avalista). Preenchimento corrige o cadastro; avalista pode reavaliar / validar arquivos. |
        | **`em_avaliacao`** | Em análise pelo time interno (fluxo operacional). |
        | **`aprovado`** | Aprovado pelo avalista/admin. Exiba `limite_aprovado`, `prazo_atualizacao_cadastral` e `sla`. |
        | **`rejeitado`** | Cadastro recusado (`resultado: rejeitado` ou alias `recusado`). Leia **`observacao`** (opcional). |
        | **`vencido`** | Aprovado cujo **`sla`** passou da data atual (atualização automática nas consultas). |
        | **`cancelado`** | Cadastro cancelado. |

        > **Nota:** o resultado de avaliação `solicitar_correcoes` **persiste** o status como **`inconsistente`** (não existe mais coluna/status `solicitar_correcoes` no workflow atual).

    - id: papeis
      title: Papéis de usuário (preenchimento / avalista / administrador)
      content: |
        O employee autenticado pode ter **um** papel em `cedente_role` (`preenchimento`, `avalista`, `administrador`).

        | Ação | Preenchimento | Avalista | Administrador |
        |------|---------------|----------|---------------|
        | Criar (`POST /cedente/save`) | Sim | **Não** | Sim |
        | Editar formulário (`PUT` / `PATCH`) | Só em `rascunho` ou `inconsistente` | **Não** | Sim |
        | Excluir (`DELETE`) | **Não** | **Não** | Sim |
        | Ver detalhe / listar / histórico | Sim | Sim (qualquer status) | Sim |
        | Validar arquivo (`PATCH /cedente/arquivo/validacao`) | **Não** | Sim (exceto `rascunho`) | Sim |
        | Avaliar cedente (`PATCH /cedente/avaliacao`) | **Não** | Sim (exceto `rascunho`) | Sim |
        | Download ZIP dos arquivos | Sim | Sim | Sim |

        **Preenchimento — status que pode enviar no edit:** `rascunho`, `pendente`, `inconsistente` (com regras de transição: de rascunho só rascunho/pendente; de inconsistente só pendente/inconsistente).

        **Avalista — o que pode alterar:**
        - **Não** edita campos do formulário (nome, endereço, pessoas, contas, etc.).
        - Usa **`PATCH /cedente/avaliacao`** para mudar status do cedente (`aprovado`, inconsistente via `solicitar_correcoes`, `rejeitado`).
        - Usa **`PATCH /cedente/arquivo/validacao`** para aprovar/recusar cada arquivo.
        - Quando algo do cadastro precisa mudar, coloca observação + `solicitar_correcoes` (status `inconsistente`); o **preenchimento** corrige os campos.

        Usuário **sem** papel de cedente **não** pode avaliar nem validar arquivos (apenas admin/avalista).

    - id: rascunho
      title: Por que o cadastro ficou em rascunho?
      content: |
        O backend **não exige** todos os campos na primeira gravação. Ao salvar (`POST /cedente/save`, `PUT /cedente/edit` ou `PATCH /cedente/patch`), se **qualquer** item abaixo estiver faltando, o status permanece ou volta para **`rascunho`**:

        | Bloco | O que precisa estar preenchido |
        |-------|-------------------------------|
        | Cedente | `fund_id`, `nome`, `documento` |
        | Endereço | `cep`, `logradouro`, `numero`, `bairro`, `estado`, `cidade` |
        | Partes relacionadas | Ao menos **1** item em `partes_relacionadas` com `nome` |
        | Contas de desembolso | Ao menos **1** conta com `tipo_conta`, `codigo_banco`, `agencia`, `numero_conta` |
        | Documentos | **13** arquivos distintos (`document_type` de **1** a **13**), cada um com `original_name` e `content_base64` (ou `base64`) |

        Quando **todos** os itens acima estiverem ok, o status passa automaticamente para **`pendente`** (com SLA de dias úteis). A validação **SERPRO** automática está **desligada temporariamente** (front ainda não preparado); o cadastro completo permanece em `pendente` sem gerar inconsistências SERPRO.

        **Dica:** não tente forçar `status: pendente` no JSON enquanto o cadastro estiver incompleto; o backend mantém `rascunho` ou retorna erro 400.

    - id: serpro
      title: Validação SERPRO (automática) — temporariamente desligada
      content: |
        A comparação automática com a API SERPRO (QSA) após promoção para `pendente` está **comentada/desligada** no backend até o front tratar inconsistências SERPRO.

        Quando reativada, o fluxo esperado será:

        1. Eventos no **`historico`** (`validacao_iniciada`, `validacao_serpro_chamada`, `validacao_serpro` ou `validacao_serpro_erro`).
        2. Comparação de nome, documento, endereço e partes relacionadas.
        3. Preenchimento de **`inconsistencias`** e eventual `status: inconsistente`.

        Hoje, inconsistências na prática vêm de **arquivo recusado** pelo avalista/admin ou de **avaliação** `solicitar_correcoes`.

    - id: arquivos
      title: Arquivos (envio e resposta)
      content: |
        Cada item em **`arquivos`** retorna metadados (sem binário):

        | Campo | Uso no front |
        |-------|----------------|
        | `id` | ID em `cedente_file`; use em **`PATCH /cedente/arquivo/validacao`**. |
        | `document_type` | Inteiro **1–13** (tipos fixos; ver schema `DocumentTypeCedente`). |
        | `document_type_label` | Rótulo legível (ex.: "Cartão CNPJ"). |
        | `valido` | `false` = aguardando avaliação; `true` = aprovado pelo avalista/admin. |
        | `status_arquivo` | `em_avaliacao` ou `valido` (espelho de `valido` para exibição). |

        **Envio:** cada arquivo no body precisa de `document_type`, `original_name` e `content_base64` (ou `base64`). Limite ~20MB após decodificar.

        **PATCH parcial de arquivos:** em `PATCH /cedente/patch`, envie **apenas** os `document_type` que deseja criar/substituir — os demais **não são apagados**. Útil para reenviar um documento recusado sem reenviar os 13.

        **Validação (apenas avalista ou administrador):** `PATCH /cedente/arquivo/validacao` com `fund_id`, `id` (do arquivo) e `valido`:

        - `valido: true` → arquivo aprovado.
        - `valido: false` → soft delete do arquivo (some da lista `arquivos` para o usuário; permanece no banco/histórico), inconsistência `arquivo.document_type.{n}`, cedente → **`inconsistente`**. Campo opcional `motivo`.
        - **Preenchimento não pode** aprovar/recusar arquivos.

        **Reenvio após recusa:** `PATCH /cedente/patch` com só o `document_type` faltante; remove a inconsistência daquele tipo. Se não restarem inconsistências e o status era `inconsistente`, volta para **`pendente`**. Registros soft-deleted antigos **não** são apagados (auditoria).

        **Download ZIP:** `GET /cedentes/arquivos/download-all/{id}?fund_id=` — zip com todos os arquivos **ativos** (não soft-deleted), organizados por pasta do tipo de documento.

    - id: avaliacao
      title: Avaliação do avalista / administrador
      content: |
        `PATCH /cedente/avaliacao` — corpo: `fund_id`, `id` (cedente), `resultado`.
        **Somente avalista ou administrador.** Avalista não avalia cedente em `rascunho`.

        | `resultado` | Campos | Efeito |
        |-------------|--------|--------|
        | `aprovado` | **Obrigatórios:** `limite_aprovado`, `prazo_atualizacao_cadastral` (meses ≥ 1). `observacao` opcional | `status → aprovado`; `sla` = hoje + N meses |
        | `solicitar_correcoes` (ou alias de inconsistente) | `observacao` **opcional** | `status → inconsistente` |
        | `rejeitado` (alias: `recusado`) | `observacao` **opcional** | `status → rejeitado` |

        Após aprovação, cedentes com `sla` vencido passam para **`vencido`** automaticamente (job diário e em `GET` / listagem).

    - id: envelope
      title: Envelope padrão das respostas
      content: |
        | Rota | Formato |
        |------|---------|
        | `GET /cedentes/get/{id}` | `{ "error": "false", "data": CedenteDetail }` |
        | `POST /cedente/save`, `PUT /cedente/edit`, `PATCH /cedente/patch`, `PATCH /cedente/arquivo/validacao`, `PATCH /cedente/avaliacao` | `{ "error": "false", "message": "...", "data": CedenteDetail }` |
        | `GET /cedentes/historico/{id}` | `{ "error": "false", "data": [ eventos ] }` |
        | `GET /cedentes/arquivos/download-all/{id}` | Binário ZIP (`Content-Type` application/zip) |
        | `POST /cedentes/all` | Paginação Laravel + `cadastro_status_resumo` na raiz |
        | Erros | `{ "error": "true", "message": "texto do erro" }` (HTTP 400) |

    - id: inconsistencias-historico
      title: Campos inconsistencias e historico
      content: |
        Toda vez que um cedente é retornado — `GET /cedentes/get/{id}`, `POST /cedentes/all`, e o `data` de `POST /cedente/save`, `PUT /cedente/edit` e `PATCH /cedente/patch` — o objeto inclui **`inconsistencias`** e **`historico`**:

        ```json
        "inconsistencias": [
          { "id": 1, "campo_inconsistente": "arquivo.document_type.4", "valor_serpro": "Cartão CNPJ recusado" }
        ],
        "historico": [
          { "id": 1, "event": "cadastro_criado", "old_status": null, "new_status": "rascunho", "changes": { "descricao": "Cadastro criado em rascunho" }, "user_id": 1, "user_name": "Maria Souza", "usuario_email": "user@exemplo.com", "created_at": "2026-07-09 12:00:00" }
        ]
        ```

        - **`inconsistencias`**: array vazio `[]` quando não há pendências. Recusa de arquivo usa `campo_inconsistente: arquivo.document_type.{n}`.
        - **`historico`**: eventos de `cedente_audit` (mais recente primeiro). Em `arquivo_recusado`, `changes` inclui `arquivo_id`, `name`, `original_name`, `soft_deleted: true` (auditoria mesmo após soft delete).

        Eventos possíveis: `cadastro_criado`, `cedente_atualizado`, `status_alterado`, `validacao_iniciada`, `validacao_serpro_chamada`, `validacao_serpro`, `validacao_serpro_erro`, `arquivo_validado`, `arquivo_recusado`, `avaliacao_registrada`.

    - id: rotas
      title: Rotas (referência rápida)
      content: |
        ### Cadastro

        - **`POST /cedente/save`** — criar (completo ou rascunho). Só `fund_id` obrigatório. (preenchimento / admin)
        - **`PUT /cedente/edit`** — snapshot completo; listas enviadas **substituem** as anteriores (omitir lista = esvaziar).
        - **`PATCH /cedente/patch`** — parcial; só chaves enviadas mudam. `arquivos`: upsert por `document_type` (não apaga os não enviados).
        - **`DELETE /cedente/remove/{id}`** — exclusão (`fund_id` na query). Somente **admin**.

        ### Consulta

        - **`GET /cedentes/get/{id}`** — detalhe (`partes_relacionadas` e `avalistas` separados; inclui `inconsistencias` e `historico`).
        - **`POST /cedentes/all`** — listagem paginada + `cadastro_status_resumo`.
        - **`POST /cedentes/status-resumo`** — contagem por status.
        - **`GET /cedentes/historico/{id}`** — só o array de histórico.
        - **`GET /cedentes/arquivos/download-all/{id}?fund_id=`** — ZIP com arquivos ativos do cedente.

        ### Análise (avalista / administrador)

        - **`PATCH /cedente/arquivo/validacao`** — aprovar ou recusar um arquivo (`id` = `cedente_file.id`).
        - **`PATCH /cedente/avaliacao`** — aprovar, solicitar correções (→ inconsistente) ou rejeitar cedente.

        Itens com o **mesmo CPF** em `partes_relacionadas` e `avalistas` são unificados em um único registro com ambas as flags.

tags:
  - name: Autenticação
    description: Login e validação de sessão (rotas web do Laravel)
  - name: Cedente
    description: CRUD de cadastro, consultas, listagens e download de arquivos
  - name: Análise
    description: Validação de arquivos e avaliação do avalista/administrador (backoffice)

security:
  - userIdHeader: []
    authTokenHeader: []

paths:
  /login:
    post:
      tags: [Autenticação]
      operationId: login
      summary: Login (email e senha)
      description: |
        Implementado em `UserController@login` (`routes/web.php`). Mesma origem/base URL que `/cedente/*` (ex.: porta 8000 do Apache/PHP ou proxy reverso).

        Corpo: JSON com `email` e `password`, ou `application/x-www-form-urlencoded` com os mesmos campos.

        Credenciais inválidas retornam HTTP 200 com `user` e `token` nulos (não há código 401 explícito no controller).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              json:
                summary: JSON
                value:
                  email: usuario@exemplo.com
                  password: "sua_senha"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sucesso (token preenchido) ou falha (user e token nulos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                sucesso:
                  summary: Login ok
                  value:
                    token: "YmFzZTY0X3Rva2VuX2V4ZW1wbG8="
                    user:
                      id: 1
                      email: usuario@exemplo.com
                falha:
                  summary: Credenciais inválidas
                  value:
                    token: null
                    user: null

  /check-token:
    get:
      tags: [Autenticação]
      operationId: checkToken
      summary: Verificar se token ainda é válido
      description: |
        Headers obrigatórios: `User` (id) e `Authorization` (token cru, igual ao login).
        Resposta: `{ "status": true | false }`.
      responses:
        "200":
          description: Resultado da comparação do token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckTokenResponse"
        "403":
          description: Headers ausentes ou token inválido (mensagem em JSON ou texto)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
            text/plain:
              schema:
                type: string

  /logout:
    post:
      tags: [Autenticação]
      operationId: logout
      summary: Encerrar sessão (invalida o token no servidor)
      description: |
        Requer headers `User` e `Authorization` (mesmo formato das demais rotas autenticadas).
      responses:
        "200":
          description: Processado (corpo pode ser vazio)
        "403":
          description: Não autenticado

  /cedente/save:
    post:
      tags: [Cedente]
      operationId: createCedente
      summary: Criar cedente (completo ou rascunho)
      description: |
        **`fund_id` obrigatório** no JSON (inteiro ≥ 1, fundo existente em `fund`).
        Demais campos são opcionais: cadastro incompleto recebe status **`rascunho`**.
        Quando todos os blocos obrigatórios estiverem preenchidos (ver descrição geral), o status passa para **`pendente`** automaticamente.
        A resposta inclui **`inconsistencias`** (preenchido se o status for `inconsistente`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CedenteCreateRequest"
            examples:
              rascunho:
                $ref: "#/components/examples/CedenteCreateBody"
              completo:
                $ref: "#/components/examples/CedenteCreateBodyCompleto"
      responses:
        "200":
          description: |
            Cadastro realizado. O `data` retornado inclui `status`, `inconsistencias`, `historico` e `arquivos`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteSaveOrEditSuccessResponse"
        "400":
          description: Validação ou erro de persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedente/edit:
    put:
      tags: [Cedente]
      operationId: updateCedente
      summary: Atualizar cedente (snapshot completo)
      description: |
        Substitui dados do cadastro conforme o body. **`fund_id`** obrigatório.
        `nome` e `documento` obrigatórios apenas quando o cadastro estiver completo (fora de rascunho).
        Após salvar, se o cadastro passar a estar completo saindo de rascunho, promove para `pendente` + SERPRO.
        `partes_relacionadas`, `avalistas` e `contas_desembolso` **sempre** recriadas a partir do JSON (listas omitidas = vazias).
        Para alterar só um campo (ex.: status), use **`PATCH /cedente/patch`**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CedenteUpdateRequest"
      responses:
        "200":
          description: Atualização realizada; `data` inclui `status` e `inconsistencias`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteSaveOrEditSuccessResponse"
        "400":
          description: Validação ou erro de persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedente/patch:
    patch:
      tags: [Cedente]
      operationId: patchCedente
      summary: Atualização parcial (um ou mais campos)
      description: |
        Envie **`id`** e **`fund_id`** (obrigatórios) e apenas os demais campos a alterar (ex.: `telefone`, um único item em `arquivos`).
        O que não vier no JSON **não é alterado**.
        - **`arquivos`**: envie só os `document_type` a criar/substituir (upsert); os demais arquivos **permanecem**.
        - **`partes_relacionadas` / `avalistas`**: se a chave vier, a lista **substitui** a anterior (mesma regra do PUT para essas listas).
        - **`contas_desembolso`**: se a chave vier, substitui todas as contas.
        Completar todos os blocos obrigatórios em um cedente `rascunho` promove automaticamente para `pendente` + SERPRO.
        Não use esta rota para substituir o cadastro inteiro — use `PUT /cedente/edit`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CedentePatchRequest"
            examples:
              umCampo:
                summary: Alterar só o telefone
                value:
                  id: 42
                  fund_id: 1
                  telefone: "11999998888"
              reenvioArquivo:
                $ref: "#/components/examples/CedentePatchReenvioArquivo"
      responses:
        "200":
          description: Atualização realizada; `data` inclui `status` e `inconsistencias`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteSaveOrEditSuccessResponse"
        "400":
          description: Validação ou erro de persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedente/arquivo/validacao:
    patch:
      tags: [Análise]
      operationId: validarArquivoCedente
      summary: Aprovar ou recusar arquivo do cedente
      description: |
        Validação manual de um arquivo (`cedente_file`). **Apenas avalista ou administrador.**
        Preenchimento **não** pode chamar esta rota. Avalista **não** valida arquivos de cedente em `rascunho`.

        Corpo JSON obrigatório:

        | Campo | Tipo | Descrição |
        |-------|------|-----------|
        | `fund_id` | int | Escopo do fundo |
        | `id` | int | **`cedente_file.id`** (não confundir com `cedente.id`) |
        | `valido` | bool | `true` aprova; `false` recusa |
        | `motivo` | string | Opcional ao recusar; gravado em `inconsistencias.valor_serpro` |

        **Aprovar (`valido: true`):** `status_arquivo` passa a `valido`; evento `arquivo_validado` no histórico.

        **Recusar (`valido: false`):** soft delete do arquivo (some de `arquivos` na API; permanece no banco para auditoria), inconsistência `arquivo.document_type.{n}`, cedente → **`inconsistente`**, evento `arquivo_recusado` (com `name` / `original_name` no histórico).

        **Reenvio:** o cliente corrige via `PATCH /cedente/patch` enviando só o `document_type` recusado em `arquivos`; a inconsistência é removida e, sem outras pendências, o status volta para **`pendente`**. Soft-deletes anteriores são preservados.

        Resposta: envelope padrão com `data` = `CedenteDetail` atualizado (`inconsistencias`, `historico`, `arquivos`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CedenteArquivoValidacaoRequest"
            examples:
              aprovar:
                $ref: "#/components/examples/CedenteArquivoValidacaoAprovar"
              recusar:
                $ref: "#/components/examples/CedenteArquivoValidacaoRecusar"
      responses:
        "200":
          description: Cedente atualizado após validação do arquivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteSaveOrEditSuccessResponse"
        "400":
          description: Validação, permissão ou erro de persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedente/avaliacao:
    patch:
      tags: [Análise]
      operationId: avaliarCedente
      summary: Avaliação do avalista/admin (aprovar, inconsistente ou rejeitar)
      description: |
        Registra a decisão do **avalista** ou **administrador** sobre o cedente.
        Preenchimento **não** pode avaliar. Avalista **não** avalia cedente em `rascunho`.

        Corpo JSON:

        | Campo | Obrigatório | Descrição |
        |-------|-------------|-----------|
        | `fund_id` | sim | Escopo do fundo |
        | `id` | sim | ID do **cedente** |
        | `resultado` | sim | `aprovado` \| `solicitar_correcoes` \| `rejeitado` (alias: `recusado`) |
        | `limite_aprovado` | se `aprovado` | Decimal (até 12 dígitos + 2 decimais). Aceita `1500000,50` ou `1500000.50` |
        | `prazo_atualizacao_cadastral` | se `aprovado` | Inteiro ≥ 1 (meses); define o novo `sla` |
        | `observacao` | não | Opcional em todos os resultados (incluindo inconsistente e rejeitado) |

        Efeitos:

        - `aprovado` → `status: aprovado`, `sla` = hoje + N meses
        - `solicitar_correcoes` → `status: inconsistente` (resultado da avaliação continua `solicitar_correcoes` no histórico)
        - `rejeitado` / `recusado` → `status: rejeitado`

        Eventos no histórico: `avaliacao_registrada` e, se o status mudou, `status_alterado`.

        Cedentes **aprovados** com `sla` &lt; hoje passam para **`vencido`** (job diário 00:05 e nas consultas).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CedenteAvaliacaoRequest"
            examples:
              aprovado:
                $ref: "#/components/examples/CedenteAvaliacaoAprovado"
              solicitarCorrecoes:
                $ref: "#/components/examples/CedenteAvaliacaoSolicitarCorrecoes"
              rejeitado:
                $ref: "#/components/examples/CedenteAvaliacaoRejeitado"
      responses:
        "200":
          description: Avaliação registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteSaveOrEditSuccessResponse"
        "400":
          description: Validação, permissão ou erro de persistência
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedentes/get/{id}:
    get:
      tags: [Cedente]
      operationId: getCedenteById
      summary: Obter cedente por id
      description: |
        Retorna o cadastro completo no formato do front (`partes_relacionadas` e `avalistas` separados).
        Inclui sempre **`inconsistencias`** e **`historico`** (arrays vazios ou preenchidos).
        Query **`fund_id` obrigatória**.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fund_id
          in: query
          required: true
          description: ID do fundo (obrigatório). Inteiro ≥ 1; fundo deve existir.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteGetSuccessResponse"
              examples:
                detalhe:
                  $ref: "#/components/examples/CedenteGetSuccessExample"
        "404":
          description: Cedente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedentes/historico/{id}:
    get:
      tags: [Cedente]
      operationId: listCedenteHistoricoStatus
      summary: Histórico de eventos do cadastro (somente histórico)
      description: |
        Retorna apenas o array de eventos de `cedente_audit` (mesmo conteúdo do campo `historico` no GET unitário).
        Use quando precisar atualizar só o histórico sem recarregar o cadastro inteiro.
        Query **`fund_id` obrigatória** (mesmo escopo das demais rotas de cedente).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fund_id
          in: query
          required: true
          description: ID do fundo (obrigatório). Inteiro ≥ 1; fundo deve existir.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lista ordenada do mais recente ao mais antigo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteHistoricoStatusResponse"
        "404":
          description: Cedente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedentes/arquivos/download-all/{id}:
    get:
      tags: [Cedente]
      operationId: downloadAllArquivosCedente
      summary: Download ZIP com todos os arquivos ativos do cedente
      description: |
        Gera um arquivo ZIP com os documentos **ativos** do cedente (não inclui soft-deleted / recusados).
        Dentro do ZIP, cada tipo de documento fica em uma pasta nomeada pelo rótulo do `document_type`.

        Query **`fund_id` obrigatória**. Qualquer papel autenticado com acesso ao fundo pode baixar (preenchimento, avalista, admin).

        Resposta de sucesso: binário ZIP (`Content-Type: application/zip`, `Content-Disposition: attachment`).
      parameters:
        - name: id
          in: path
          required: true
          description: ID do cedente
          schema:
            type: integer
            minimum: 1
        - name: fund_id
          in: query
          required: true
          description: ID do fundo (obrigatório). Inteiro ≥ 1; fundo deve existir.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Arquivo ZIP gerado
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: fund_id inválido ou sem permissão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Cedente não encontrado ou sem arquivos físicos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /cedentes/all:
    post:
      tags: [Cedente]
      operationId: listCedentes
      summary: Listar cedentes (paginação Laravel)
      description: |
        **`fund_id` obrigatório** no corpo JSON. Lista apenas cedentes desse fundo.
        Cada item em `data` inclui os arrays **`inconsistencias`** e **`historico`**.
        A raiz da resposta inclui `fund_id` e **`cadastro_status_resumo`** (contagens por status, incluindo `rascunho`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fund_id]
              properties:
                fund_id:
                  type: integer
                  minimum: 1
                  description: ID do fundo (obrigatório).
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                  description: Itens por página
      responses:
        "200":
          description: Página de resultados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedentePaginatedListResponse"

  /cedentes/status-resumo:
    post:
      tags: [Cedente]
      operationId: cedentesCadastroStatusResumo
      summary: Resumo de cadastros por status
      description: |
        **`fund_id` obrigatório** no corpo JSON. Retorna contagens por status e total de cedentes **do fundo informado**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fund_id]
              properties:
                fund_id:
                  type: integer
                  minimum: 1
                  description: ID do fundo (obrigatório).
      responses:
        "200":
          description: Contagens atuais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedenteStatusResumoResponse"

  /cedente/remove/{id}:
    delete:
      tags: [Cedente]
      operationId: deleteCedente
      summary: Excluir cedente e dependências
      description: |
        Query **`fund_id` obrigatória** — exclusão limitada ao escopo do fundo informado.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: fund_id
          in: query
          required: true
          description: ID do fundo (obrigatório). Inteiro ≥ 1; fundo deve existir.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Excluído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessMessageOnly"
        "404":
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Erro ao excluir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: User
      description: |
        ID numérico do usuário (`user.id` retornado por `POST /login`).
        O middleware `auth.api` também aceita `user_id` no corpo em alguns casos; o padrão para APIs é este header.
    authTokenHeader:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Token retornado no campo `token` de `POST /login`, **sem** prefixo `Bearer `.
        O valor enviado aqui deve ser **idêntico** ao string `token` da resposta.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      description: Resposta do `UserController@login`.
      properties:
        token:
          type: string
          nullable: true
          description: Token de API; null se login falhou.
        user:
          nullable: true
          description: |
            Modelo `User` serializado (senha oculta), com relações carregadas pelo login (`functionalities`, `employee`, `displays`, etc.), ou null se falhou.
          type: object
          additionalProperties: true

    CheckTokenResponse:
      type: object
      required: [status]
      properties:
        status:
          type: boolean
          description: true se o token confere com o armazenado para o usuário informado.

    ApiErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: ["true"]
          description: Convenção legada do projeto (string).
        message:
          type: string

    ApiSuccessMessageOnly:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: ["false"]
        message:
          type: string

    Address:
      type: object
      description: Endereço (tabela `address`). No create/update, todos os campos são opcionais; objeto vazio remove endereço do cedente no PUT.
      properties:
        id:
          type: integer
          readOnly: true
        cep:
          type: string
          nullable: true
        logradouro:
          type: string
          nullable: true
        numero:
          type: string
          nullable: true
        complemento:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        estado:
          type: string
          nullable: true
          description: UF (2 caracteres)
          maxLength: 2
        cidade:
          type: string
          nullable: true
        pais:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    TipoParteRelacionada:
      type: integer
      nullable: true
      minimum: 1
      maximum: 4
      description: |
        Obrigatório para parte relacionada no sentido de negócio; null se for só avalista.
        1 = sócio, 2 = administrador, 3 = procurador, 4 = representante legal.

    TipoConta:
      type: string
      description: Valores exatos aceitos pelo banco (ENUM MySQL).
      enum:
        - conta_corrente
        - conta_poupanca
        - conta_salario

    PessoaVinculadaInput:
      type: object
      required: [nome]
      description: Item de `partes_relacionadas` ou `avalistas` no body de create/update.
      properties:
        nome:
          type: string
        tipo_parte_relacionada:
          $ref: "#/components/schemas/TipoParteRelacionada"
        nacionalidade:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        beneficiario_final:
          type: boolean
          default: false
        assinante_operacao:
          type: boolean
          default: false
        assinante_obrigatorio:
          type: boolean
          default: false
        estado_civil:
          type: string
          nullable: true
        regime_casamento:
          type: string
          nullable: true
        profissao:
          type: string
          nullable: true
        endereco:
          $ref: "#/components/schemas/Address"

    ContaDesembolsoInput:
      type: object
      required: [tipo_conta, codigo_banco, agencia, numero_conta]
      description: Conta de desembolso no body (sem id; `cedente_id` é definido pelo servidor).
      properties:
        tipo_conta:
          $ref: "#/components/schemas/TipoConta"
        codigo_banco:
          type: string
          maxLength: 8
        agencia:
          type: string
          maxLength: 16
        numero_conta:
          type: string
          maxLength: 32
        digito_conta:
          type: string
          nullable: true
          maxLength: 4
        descricao:
          type: string
          nullable: true

    DocumentTypeCedente:
      type: integer
      minimum: 1
      maximum: 13
      description: |
        1 Contrato/Estatuto Social · 2 Certidão Simplificada Junta Comercial · 3 Ata Eleição Diretoria ·
        4 Cartão CNPJ · 5 Parecer Compliance/Reputacional · 6 Demonstração Financeira ·
        7 Ata/Parecer Crédito · 8 Consulta Órgãos Proteção Crédito · 9 Relatório Visita ·
        10 Parecer/Ficha Gestor · 11 Comprovante Residência · 12 Declaração Faturamento ·
        13 Declaração Relacionamento Bancário.

    CedenteArquivoInput:
      type: object
      required: [document_type, original_name]
      description: |
        Um dos 13 documentos. Informe `content_base64` ou `base64` com o arquivo.
        Base64 puro ou data URL (`data:application/pdf;base64,...`). Limite ~20MB por arquivo após decodificar.
      properties:
        document_type:
          $ref: "#/components/schemas/DocumentTypeCedente"
        original_name:
          type: string
          description: Nome exibido/enviado pelo cliente (ex. contrato.pdf).
        content_base64:
          type: string
        base64:
          type: string
          description: Alias opcional de content_base64.
        type:
          type: string
          description: Opcional; extensão sugerida (ex. pdf), alinhado ao uso de `type` em project_file.

    CedenteArquivoResource:
      type: object
      description: Metadado do arquivo salvo (sem o binário).
      properties:
        id:
          type: integer
        document_type:
          $ref: "#/components/schemas/DocumentTypeCedente"
        document_type_label:
          type: string
          nullable: true
        original_name:
          type: string
        name:
          type: string
          description: Nome do arquivo no servidor (pasta cedente-files).
        type:
          type: string
          nullable: true
        valido:
          type: boolean
          description: "`true` = válido; `false` = em avaliação (padrão ao enviar)."
        status_arquivo:
          type: string
          enum: [em_avaliacao, valido]
          description: Rótulo derivado de `valido` para exibição no front.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CedenteArquivoValidacaoRequest:
      type: object
      required: [fund_id, id, valido]
      properties:
        fund_id:
          type: integer
          minimum: 1
        id:
          type: integer
          minimum: 1
          description: ID do registro em `cedente_file`.
        valido:
          type: boolean
          description: "`true` aprova; `false` recusa (soft delete + inconsistência)."
        motivo:
          type: string
          description: Opcional ao recusar; gravado em `inconsistencias.valor_serpro`.

    CedenteCreateRequest:
      type: object
      required: [fund_id]
      description: |
        **`fund_id` obrigatório** em todo cadastro/edição (inteiro ≥ 1, fundo existente).
        Cadastro incompleto → status `rascunho` (sem SERPRO). `arquivos` opcional em rascunho; necessários 13 tipos (1–13) para promoção a `pendente`.
        No **PUT /cedente/edit**, `arquivos` é opcional; se enviado, substitui os anteriores.
      properties:
        fund_id:
          type: integer
          minimum: 1
          description: ID do fundo ao qual o cedente pertence (obrigatório).
        nome:
          type: string
          nullable: true
          description: Opcional em rascunho; obrigatório para cadastro completo.
        documento:
          type: string
          nullable: true
          description: Opcional em rascunho; obrigatório para cadastro completo.
        email:
          type: string
          nullable: true
        faturamento_anual:
          type: number
          format: double
          nullable: true
        minimo_assinantes:
          type: integer
          minimum: 0
          nullable: true
        sistema_financeiro_nacional:
          type: boolean
          default: false
        telefone:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CedenteCadastroStatus"
          description: Opcional no POST; inferido automaticamente (`rascunho` ou `pendente`). Não é possível forçar status final enquanto incompleto.
        endereco:
          $ref: "#/components/schemas/Address"
        partes_relacionadas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaInput"
          default: []
        avalistas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaInput"
          default: []
        contas_desembolso:
          type: array
          items:
            $ref: "#/components/schemas/ContaDesembolsoInput"
          default: []
        arquivos:
          type: array
          items:
            $ref: "#/components/schemas/CedenteArquivoInput"
          description: |
            Opcional em rascunho. Para cadastro completo, envie os treze documentos (tipos 1–13, sem repetir).

    CedenteUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/CedenteCreateRequest"
        - type: object
          required: [id, fund_id]
          properties:
            id:
              type: integer
              minimum: 1

    CedentePatchRequest:
      type: object
      required: [id, fund_id]
      description: |
        Atualização parcial (`PATCH /cedente/patch`). `id` e `fund_id` obrigatórios (escopo do fundo).
      properties:
        id:
          type: integer
          minimum: 1
        fund_id:
          type: integer
          minimum: 1
        nome:
          type: string
        documento:
          type: string
        email:
          type: string
          nullable: true
        faturamento_anual:
          type: number
          format: double
          nullable: true
        minimo_assinantes:
          type: integer
          minimum: 0
          nullable: true
        sistema_financeiro_nacional:
          type: boolean
        telefone:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CedenteCadastroStatus"
        endereco:
          $ref: "#/components/schemas/Address"
        partes_relacionadas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaInput"
        avalistas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaInput"
        contas_desembolso:
          type: array
          items:
            $ref: "#/components/schemas/ContaDesembolsoInput"
        arquivos:
          type: array
          items:
            $ref: "#/components/schemas/CedenteArquivoInput"
          description: |
            Se enviado, faz **upsert** por `document_type`: só os tipos listados são criados/substituídos;
            os demais arquivos do cedente **não são removidos**. Ideal para reenvio de um documento recusado.

    PessoaVinculadaDetail:
      type: object
      description: Pessoa persistida; no GET/save/edit aparece dentro de `partes_relacionadas` e/ou `avalistas` conforme flags.
      properties:
        id:
          type: integer
        cedente_id:
          type: integer
        e_parte_relacionada:
          type: boolean
        e_avalista:
          type: boolean
        nome:
          type: string
        tipo_parte_relacionada:
          $ref: "#/components/schemas/TipoParteRelacionada"
        nacionalidade:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        beneficiario_final:
          type: boolean
        assinante_operacao:
          type: boolean
        assinante_obrigatorio:
          type: boolean
        estado_civil:
          type: string
          nullable: true
        regime_casamento:
          type: string
          nullable: true
        profissao:
          type: string
          nullable: true
        address_id:
          type: integer
          nullable: true
        endereco:
          $ref: "#/components/schemas/Address"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CedenteCadastroStatus:
      type: string
      description: |
        Status do cadastro. Referência para o front:
        - **`rascunho`** — incompleto; editável por preenchimento/admin.
        - **`pendente`** — completo; aguardando avalista/admin.
        - **`inconsistente`** — pendências em `inconsistencias` (arquivo recusado ou `solicitar_correcoes`).
        - **`rejeitado`** — recusado pelo avalista/admin; leia `observacao` (opcional).
        - **`aprovado`** — leia `limite_aprovado`, `prazo_atualizacao_cadastral`, `sla`.
        - **`vencido`** — aprovado com SLA expirado.
      enum:
        - rascunho
        - pendente
        - em_avaliacao
        - inconsistente
        - aprovado
        - solicitar_correcoes
        - rejeitado
        - vencido
        - cancelado

    CedenteAvaliacaoResultado:
      type: string
      description: |
        `solicitar_correcoes` persiste status **`inconsistente`**.
        Alias aceito: `recusado` → `rejeitado`.
      enum:
        - aprovado
        - solicitar_correcoes
        - rejeitado

    CedenteAvaliacaoRequest:
      type: object
      required: [fund_id, id, resultado]
      properties:
        fund_id:
          type: integer
          minimum: 1
        id:
          type: integer
          minimum: 1
          description: ID do cedente.
        resultado:
          $ref: "#/components/schemas/CedenteAvaliacaoResultado"
        observacao:
          type: string
          description: Opcional para todos os resultados (aprovado, inconsistente via solicitar_correcoes, rejeitado).
        limite_aprovado:
          type: string
          description: Obrigatório para `aprovado`. Até 12 dígitos antes da vírgula e 2 decimais (ex. `1500000.50`).
        prazo_atualizacao_cadastral:
          type: integer
          minimum: 1
          description: Obrigatório para `aprovado`. Prazo em **meses** para o novo SLA (`sla`).

    CedenteStatusResumoData:
      type: object
      required:
        - rascunho
        - pendente
        - em_avaliacao
        - inconsistente
        - aprovado
        - solicitar_correcoes
        - rejeitado
        - vencido
        - cancelado
        - total
      properties:
        rascunho:
          type: integer
          minimum: 0
        pendente:
          type: integer
          minimum: 0
        em_avaliacao:
          type: integer
          minimum: 0
        inconsistente:
          type: integer
          minimum: 0
        aprovado:
          type: integer
          minimum: 0
        solicitar_correcoes:
          type: integer
          minimum: 0
        rejeitado:
          type: integer
          minimum: 0
        vencido:
          type: integer
          minimum: 0
        cancelado:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Total de registros na tabela `cedente` (independente do valor de `status`).

    CedenteStatusResumoResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: string
          enum: ["false"]
        data:
          $ref: "#/components/schemas/CedenteStatusResumoData"

    CedenteHistoricoStatusItem:
      type: object
      properties:
        id:
          type: integer
        event:
          type: string
          description: |
            Tipos de evento no histórico:
            - `cadastro_criado` — cadastro criado pelo usuário
            - `cedente_atualizado` — alteração de dados pelo usuário
            - `status_alterado` — mudança de status (usuário ou sistema)
            - `validacao_iniciada` — início das validações automáticas (Sistema)
            - `validacao_serpro_chamada` — chamada à API SERPRO (Sistema)
            - `validacao_serpro` — resultado da validação SERPRO (Sistema)
            - `validacao_serpro_erro` — falha na consulta SERPRO (Sistema)
            - `arquivo_validado` — analista aprovou um arquivo
            - `arquivo_recusado` — analista recusou um arquivo
            - `avaliacao_registrada` — analista registrou aprovação, correções ou rejeição
          enum:
            - cadastro_criado
            - cedente_atualizado
            - status_alterado
            - validacao_iniciada
            - validacao_serpro_chamada
            - validacao_serpro
            - validacao_serpro_erro
            - arquivo_validado
            - arquivo_recusado
            - avaliacao_registrada
        old_status:
          type: string
          nullable: true
          description: Status anterior; nulo na criação do cadastro.
        new_status:
          type: string
          description: Status após o evento.
        changes:
          type: object
          nullable: true
          description: |
            Detalhes do evento. Sempre inclui `descricao` (texto legível para exibir na tela).
            Ex.: `{ "descricao": "Cadastro criado" }`, `{ "descricao": "Validacao SERPRO concluida com inconsistencias", "campos_inconsistentes": ["nome"] }`.
        user_id:
          type: integer
          nullable: true
          description: ID do usuário responsável. `null` quando o evento foi disparado pelo sistema.
        user_name:
          type: string
          description: Nome do usuário responsável (`employee.name`). Retorna **Sistema** quando `user_id` é nulo.
        usuario_email:
          type: string
          nullable: true
          format: email
          description: E-mail do usuário responsável. Nulo para eventos do sistema.
        created_at:
          type: string
          format: date-time
          description: Data/hora do registro (quando ocorreu o evento).

    CedenteHistoricoStatusResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: string
          enum: ["false"]
        data:
          type: array
          items:
            $ref: "#/components/schemas/CedenteHistoricoStatusItem"

    CedenteInconsistenciaItem:
      type: object
      description: |
        Divergência pendente. Origem SERPRO (campos do cadastro) ou recusa de arquivo (`arquivo.document_type.{n}`).
      properties:
        id:
          type: integer
        campo_inconsistente:
          type: string
          description: |
            Identificador do campo no cadastro. Exemplos:
            - SERPRO: `nome`, `documento`, `endereco.cep`, `partes_relacionadas[0].nome`
            - Arquivo recusado: `arquivo.document_type.4` (número = `document_type`)
            Use para destacar o input ou o slot de upload correspondente no formulário.
        valor_serpro:
          type: string
          nullable: true
          description: Valor de referência (SERPRO) ou motivo da recusa do arquivo.

    ContaDesembolsoResource:
      type: object
      properties:
        id:
          type: integer
        cedente_id:
          type: integer
        tipo_conta:
          $ref: "#/components/schemas/TipoConta"
        codigo_banco:
          type: string
        agencia:
          type: string
        numero_conta:
          type: string
        digito_conta:
          type: string
          nullable: true
        descricao:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CedenteDetail:
      type: object
      description: |
        Formato retornado em `data` no GET, save, edit, patch, validação de arquivo e avaliação.
        Sempre inclui **`inconsistencias`**, **`historico`** e **`arquivos`** (metadados, sem base64).
      properties:
        id:
          type: integer
        fund_id:
          type: integer
        nome:
          type: string
          nullable: true
        documento:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        faturamento_anual:
          type: string
          nullable: true
          description: Decimal pode vir como string no JSON do Laravel.
        minimo_assinantes:
          type: integer
          nullable: true
        sistema_financeiro_nacional:
          type: boolean
        telefone:
          type: string
          nullable: true
        observacao:
          type: string
          nullable: true
          description: Texto livre (motivo de correção/rejeição ou observação da aprovação).
        limite_aprovado:
          type: string
          nullable: true
          description: Limite aprovado (decimal, preenchido na aprovação).
        prazo_atualizacao_cadastral:
          type: integer
          nullable: true
          description: Prazo em meses para atualização cadastral (SLA após aprovação).
        status:
          $ref: "#/components/schemas/CedenteCadastroStatus"
        sla:
          type: string
          format: date
          nullable: true
          description: Data limite do cadastro (`Y-m-d`). Em aprovado, calculada com `prazo_atualizacao_cadastral` meses; após vencer, status → `vencido`.
        endereco:
          $ref: "#/components/schemas/Address"
          nullable: true
        partes_relacionadas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaDetail"
        avalistas:
          type: array
          items:
            $ref: "#/components/schemas/PessoaVinculadaDetail"
        contas_desembolso:
          type: array
          items:
            $ref: "#/components/schemas/ContaDesembolsoResource"
        arquivos:
          type: array
          items:
            $ref: "#/components/schemas/CedenteArquivoResource"
        inconsistencias:
          type: array
          description: |
            Sempre presente. Vazio quando não há divergências.
            Quando `status` é `inconsistente`, contém todas as divergências pendentes do cedente.
          items:
            $ref: "#/components/schemas/CedenteInconsistenciaItem"
        historico:
          type: array
          description: |
            Eventos de `cedente_audit` (mais recente primeiro). Mesmo formato de `GET /cedentes/historico/{id}`.
          items:
            $ref: "#/components/schemas/CedenteHistoricoStatusItem"

    CedenteGetSuccessResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: string
          enum: ["false"]
        data:
          $ref: "#/components/schemas/CedenteDetail"

    CedenteSaveOrEditSuccessResponse:
      type: object
      required: [error, message, data]
      properties:
        error:
          type: string
          enum: ["false"]
        message:
          type: string
        data:
          $ref: "#/components/schemas/CedenteDetail"

    CedenteListItem:
      type: object
