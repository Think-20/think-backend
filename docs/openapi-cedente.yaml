        observacao:
          type: string
          nullable: true
        limite_aprovado:
          type: string
          nullable: true
        prazo_atualizacao_cadastral:
          type: integer
          nullable: true
        sla:
          type: string
          format: date
          nullable: true
        status:
          $ref: "#/components/schemas/CedenteCadastroStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        address:
          $ref: "#/components/schemas/Address"
          nullable: true
        pessoas_vinculadas:
